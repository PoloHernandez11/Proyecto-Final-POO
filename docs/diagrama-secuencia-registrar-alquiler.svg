<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="850" viewBox="0 0 1080 850" font-family="Arial, Helvetica, sans-serif">
  <title>Diagrama de secuencia - Registrar alquiler</title>
  <defs>
    <marker id="llamada" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="retorno" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#222" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1080" height="850" fill="#ffffff"/>

  <text x="540" y="28" font-size="18" font-weight="bold" text-anchor="middle">Diagrama de secuencia: Registrar alquiler</text>

  <!-- Participantes -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="30" y="50" width="100" height="36" fill="#fff" stroke="#222"/>
    <text x="80" y="73">:Empleado</text>
    <rect x="185" y="50" width="130" height="36" fill="#eaf1fb" stroke="#222"/>
    <text x="250" y="73">:AlquilerView</text>
    <rect x="360" y="50" width="160" height="36" fill="#fdf1e4" stroke="#222"/>
    <text x="440" y="73">:AlquilerController</text>
    <rect x="560" y="50" width="140" height="36" fill="#ebf6ec" stroke="#222"/>
    <text x="630" y="73">:VideojuegoDAO</text>
    <rect x="735" y="50" width="130" height="36" fill="#ebf6ec" stroke="#222"/>
    <text x="800" y="73">:AlquilerDAO</text>
    <rect x="905" y="50" width="130" height="36" fill="#f3f3f3" stroke="#222"/>
    <text x="970" y="73">Base de datos</text>
  </g>

  <!-- Lineas de vida -->
  <g stroke="#888" stroke-width="1.2" stroke-dasharray="5 4">
    <line x1="80" y1="86" x2="80" y2="820"/>
    <line x1="250" y1="86" x2="250" y2="820"/>
    <line x1="440" y1="86" x2="440" y2="820"/>
    <line x1="630" y1="86" x2="630" y2="820"/>
    <line x1="800" y1="86" x2="800" y2="820"/>
    <line x1="970" y1="86" x2="970" y2="820"/>
  </g>

  <!-- Activaciones -->
  <g fill="#fff" stroke="#222">
    <rect x="245" y="115" width="10" height="650"/>
    <rect x="435" y="155" width="10" height="605"/>
    <rect x="625" y="325" width="10" height="120"/>
    <rect x="795" y="575" width="10" height="135"/>
  </g>

  <g stroke="#222" stroke-width="1.4" font-size="12.5">
    <!-- 1 -->
    <line x1="80" y1="120" x2="244" y2="120" marker-end="url(#llamada)"/>
    <text x="88" y="113" stroke="none">1: elige cliente, videojuego, fechas</text>
    <text x="88" y="140" stroke="none" font-size="11.5" fill="#444">y presiona REGISTRAR</text>

    <!-- 2 -->
    <line x1="255" y1="165" x2="434" y2="165" marker-end="url(#llamada)"/>
    <text x="262" y="158" stroke="none">2: registrarAlquiler()</text>

    <!-- 3 -->
    <line x1="435" y1="205" x2="256" y2="205" marker-end="url(#llamada)"/>
    <text x="262" y="198" stroke="none">3: getClienteSeleccionado()</text>
    <line x1="256" y1="225" x2="434" y2="225" stroke-dasharray="5 3" marker-end="url(#retorno)"/>
    <text x="300" y="240" stroke="none" font-size="11.5" fill="#444">cliente, videojuego</text>

    <!-- 4 -->
    <line x1="435" y1="265" x2="256" y2="265" marker-end="url(#llamada)"/>
    <text x="262" y="258" stroke="none">4: getFechaAlquilerTexto() / ...</text>

    <!-- 5 self -->
    <path d="M445,285 h40 v22 h-39" fill="none" marker-end="url(#llamada)"/>
    <text x="492" y="295" stroke="none">5: leerFecha() y valida</text>
    <text x="492" y="310" stroke="none" font-size="11.5" fill="#444">devolución ≥ alquiler (regla 7)</text>

    <!-- 6 -->
    <line x1="445" y1="335" x2="624" y2="335" marker-end="url(#llamada)"/>
    <text x="452" y="328" stroke="none">6: buscarPorId(id)</text>

    <!-- 7 -->
    <line x1="635" y1="370" x2="969" y2="370" marker-end="url(#llamada)"/>
    <text x="645" y="363" stroke="none">7: SELECT ... FROM videojuego WHERE id = ?</text>
    <line x1="969" y1="400" x2="636" y2="400" stroke-dasharray="5 3" marker-end="url(#retorno)"/>
    <text x="800" y="393" stroke="none" font-size="11.5" fill="#444">fila del videojuego</text>

    <!-- 8 -->
    <line x1="625" y1="435" x2="446" y2="435" stroke-dasharray="5 3" marker-end="url(#retorno)"/>
    <text x="470" y="428" stroke="none" font-size="11.5" fill="#444">videojuego (con disponible)</text>
  </g>

  <!-- Fragmento alt -->
  <rect x="20" y="460" width="1040" height="320" fill="none" stroke="#a35200" stroke-width="1.4"/>
  <path d="M20,460 h56 v14 l-8,10 h-48 z" fill="#fdf1e4" stroke="#a35200" stroke-width="1.4"/>
  <text x="30" y="477" font-size="13" font-weight="bold">alt</text>
  <text x="90" y="480" font-size="12.5" font-style="italic">[videojuego NO disponible]  (regla 1)</text>
  <line x1="20" y1="545" x2="1060" y2="545" stroke="#a35200" stroke-width="1.2" stroke-dasharray="8 5"/>
  <text x="90" y="564" font-size="12.5" font-style="italic">[videojuego disponible]</text>

  <g stroke="#222" stroke-width="1.4" font-size="12.5">
    <!-- rama no disponible -->
    <line x1="435" y1="515" x2="256" y2="515" marker-end="url(#llamada)"/>
    <text x="262" y="508" stroke="none">9a: mostrarMensaje("no está disponible")</text>

    <!-- rama disponible -->
    <line x1="445" y1="585" x2="794" y2="585" marker-end="url(#llamada)"/>
    <text x="455" y="578" stroke="none">9b: registrar(alquiler)</text>

    <line x1="805" y1="615" x2="969" y2="615" marker-end="url(#llamada)"/>
    <text x="812" y="608" stroke="none">UPDATE videojuego</text>
    <text x="812" y="630" stroke="none" font-size="11.5" fill="#444">SET disponible = FALSE (regla 2)</text>

    <line x1="805" y1="655" x2="969" y2="655" marker-end="url(#llamada)"/>
    <text x="812" y="648" stroke="none">INSERT INTO alquiler</text>
    <text x="812" y="670" stroke="none" font-size="11.5" fill="#444">cliente_id, videojuego_id (regla 3)</text>

    <line x1="805" y1="695" x2="969" y2="695" marker-end="url(#llamada)"/>
    <text x="812" y="688" stroke="none">COMMIT (transacción)</text>

    <line x1="795" y1="710" x2="446" y2="710" stroke-dasharray="5 3" marker-end="url(#retorno)"/>
    <text x="560" y="703" stroke="none" font-size="11.5" fill="#444">ok</text>

    <line x1="435" y1="750" x2="256" y2="750" marker-end="url(#llamada)"/>
    <text x="262" y="743" stroke="none">10: mostrarMensaje("Alquiler registrado")</text>
    <text x="262" y="767" stroke="none" font-size="11.5" fill="#444">y recarga combos y tabla</text>
  </g>

  <text x="540" y="842" font-size="11.5" fill="#555" text-anchor="middle">Si algo falla entre el UPDATE y el INSERT se hace ROLLBACK: no queda un videojuego ocupado sin alquiler.</text>
</svg>
